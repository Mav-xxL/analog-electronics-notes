        "answer": 1,
        "explain": "负载需要更多电流。整流管截止期间，电容向负载供电，电压下降得更快，下一次补充充电前留下更大的波动。"

        "answer": 3,
        "explain": "78 系列是固定正电压稳压器。7812 提供 +12 V。输入电压、压差、电流与散热均需满足器件条件。"
      },
      {
        "type": "fill",
        "prompt": "理想桥式整流带纯电阻负载，未加滤波电容，变压器次级正弦电压有效值 U₂ = 12.0 V。按课程近似系数 0.90 求负载电压的平均值。",
        "answer": 10.8,

        "explain": "全波整流后取正弦绝对值的平均。U_L ≈ 0.90U₂ = 10.8 V。这里的 U₂ 是有效值。"
      },

        "prompt": "桥式整流加电容滤波，变压器次级正弦电压有效值 U₂ = 15.0 V。负载与电容量满足课件的常用有载估算条件。按 1.2U₂ 估算负载电压平均值。",

<script>
(() => {
  'use strict';
  const units=JSON.parse(document.getElementById('examBank').textContent);
  const byChapter=new Map(units.map(unit=>[String(unit.chapter),unit]));
  const $=name=>document.getElementById(name);
  const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const letters='ABCD';
  const matchNotes={
    1:'对应现有讲义第二章「半导体与二极管」。',
    2:'对应现有讲义第三章 3.1–3.6 的双极型晶体管与单级放大。',
    4:'对应现有讲义第四章「场效应管及其基本放大电路」。',
    5:'多级放大对应讲义 3.7，频率响应对应老师的第五章课件。'
  };
  const groups=[['choice','一、选择题','3 题，每题 10 分'],['fill','二、填空题','3 题，每题 10 分'],['work','三、计算与设计题','2 题，每题 20 分']];
  const key=n=>'modian-unit-exam-v1-'+n;
  const memory=new Map();
  let unit,attempt,blankPrint=false;
  function fresh(){return {answers:{},paper:{},marks:{},submitted:false};}
  function read(chapter){
    if(memory.has(chapter))return memory.get(chapter);
    const result=fresh();
    try {
      const stored=JSON.parse(localStorage.getItem(key(chapter)));
      if(stored&&typeof stored==='object'){
        for(const field of ['answers','paper','marks'])if(stored[field]&&typeof stored[field]==='object')result[field]=stored[field];
        result.submitted=stored.submitted===true;
      }
    }catch{}
    return result;
  }
  function save(){
    memory.set(unit.chapter,attempt);
    try {localStorage.setItem(key(unit.chapter),JSON.stringify(attempt));}
    catch{$('saveStatus').textContent='此浏览器暂时无法保存，作答仅保留在当前页面。';}
  }
  function clean(text){return String(text??'').normalize('NFKC').trim().replace(/\s+/g,'').replace(/[−–]/g,'-');}
  function correct(q,index){
    const raw=attempt.answers[index];
    if(q.type==='choice')return raw===q.answer;
    const input=clean(raw);
    if(!input)return false;
    if(Array.isArray(q.answer))return q.answer.some(x=>clean(x).toLowerCase()===input.toLowerCase());
    const suffix=clean(q.unit);
    const literal=suffix&&input.endsWith(suffix)?input.slice(0,-suffix.length):input;
    const parts=literal.split('/');
    const number=/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;
    if(parts.length>2||!parts.every(part=>number.test(part)))return false;
    const value=Number(parts[0])/Number(parts[1]??1);
    return Number.isFinite(value)&&Math.abs(value-q.answer)<=Math.max(Math.abs(q.answer)*.01,1e-10)+1e-12;
  }
  function answered(q,i){
    if(q.type==='choice')return Number.isInteger(attempt.answers[i]);
    return Boolean(String(attempt.answers[i]??'').trim())||(q.type==='work'&&attempt.paper[i]===true);
  }
  function reference(q){
    if(q.type==='choice')return letters[q.answer]+'．'+q.options[q.answer];
    if(Array.isArray(q.answer))return q.answer[0];
    return String(Number(q.answer.toPrecision(4)))+(q.unit?' '+q.unit:'');
  }
  function workMarks(q,i){
    if(!answered(q,i))return {pending:0,points:0};
    const marks=q.steps.map((_,j)=>attempt.marks[i+'-'+j]);
    return {pending:marks.filter(x=>x!==0&&x!==10).length,points:marks.filter(x=>x===10).length*10};
  }
  function drawSummary(){
    if(!attempt.submitted||blankPrint){$('summary').replaceChildren();return;}
    let objective=0,manual=0,pending=0;
    unit.questions.forEach((q,i)=>{
      if(q.type==='work'){const m=workMarks(q,i);manual+=m.points;pending+=m.pending;}
      else if(correct(q,i))objective+=10;
    });
    const main=pending?'客观题 '+objective+' / 60':'总分 '+(objective+manual)+' / 100';
    const detail=pending?'计算设计题还有 '+pending+' 个步骤待自评。':'客观题 '+objective+' / 60　计算设计题 '+manual+' / 40';
    $('summary').innerHTML='<div class="score"><strong>'+main+'</strong><span>'+detail+'</span></div>';
  }
  function drawQuestion(q,i){
    const submitted=attempt.submitted&&!blankPrint, disabled=submitted?' disabled':'';
    const value=blankPrint?'':attempt.answers[i]??'';
    let control='',solution='';
    if(q.type==='choice'){
      control='<div class="choices" role="radiogroup" aria-labelledby="q'+i+'">'+q.options.map((option,k)=>
        '<label class="option"><input type="radio" name="q'+i+'" data-answer="'+i+'" value="'+k+'"'+(value===k?' checked':'')+disabled+'><span>'+letters[k]+'．'+esc(option)+'</span></label>').join('')+'</div>';
    }else if(q.type==='fill'){
      control='<label class="fillRow screenAnswer"><input type="text" maxlength="120" aria-labelledby="q'+i+'" data-answer="'+i+'" value="'+esc(value)+'"'+disabled+'><span>'+esc(q.unit)+'</span></label><div class="paperAnswer">答 __________________ '+esc(q.unit)+'</div>';
    }else{
      control='<textarea class="work screenAnswer" aria-labelledby="q'+i+'" data-answer="'+i+'" placeholder="写下思路、算式和答案"'+disabled+'>'+esc(value)+'</textarea><label class="onPaper"><input data-paper="'+i+'" type="checkbox"'+(!blankPrint&&attempt.paper[i]?' checked':'')+disabled+'>已在纸上作答</label><div class="paperAnswer workLines"></div>';
    }
    if(submitted&&q.type!=='work'){
      const hit=correct(q,i), status=hit?'答对了 · 10 分':answered(q,i)?'答错了 · 0 分':'未作答 · 0 分';
      solution='<div class="solution"><span class="'+(hit?'right':'wrong')+'">'+status+'</span><p><b>参考答案</b>　'+esc(reference(q))+'</p><p>'+esc(q.explain)+'</p></div>';
    }else if(submitted){
      solution='<div class="solution"><b>'+(answered(q,i)?'按两步核对，每步 10 分':'未作答 · 0 分')+'</b>'+q.steps.map((step,j)=>{
        const mk=i+'-'+j, selected=attempt.marks[mk];
        const mark=answered(q,i)?'<label class="mark">这一步得分<select data-mark="'+mk+'"><option value="">待自评</option><option value="10"'+(selected===10?' selected':'')+'>10 分</option><option value="0"'+(selected===0?' selected':'')+'>0 分</option></select></label>':'';
        return '<div class="step"><strong>'+esc(step.criterion)+'</strong><p>'+esc(step.solution)+'</p>'+mark+'</div>';
      }).join('')+'</div>';
    }
    const figure=q.diagram?'<figure class="figure"><pre>'+esc(q.diagram)+'</pre></figure>':'';
    return '<article class="question" id="item-'+i+'"><h3 id="q'+i+'"><span class="qnum">'+(i+1)+'.</span>'+esc(q.prompt)+'</h3>'+figure+control+solution+'</article>';
  }
  function draw(){
    $('questions').innerHTML=groups.map(([type,title,points])=>'<section class="group"><h2>'+title+' <small>'+points+'</small></h2>'+
      unit.questions.map((q,i)=>q.type===type?drawQuestion(q,i):'').join('')+'</section>').join('');
    $('paperActions').innerHTML=attempt.submitted?'<button class="btn" type="button" id="retake">重做这套卷</button>':'<button class="btn primary" type="submit">交卷看解析</button>';
    drawSummary();
  }
  function openUnit(){
    const requested=location.hash.match(/^#unit-(\d+)$/)?.[1];
    unit=byChapter.get(requested)||units[0];
    if(!unit)return;
    attempt=read(unit.chapter);
    $('unitSelect').value=unit.chapter;
    for(const a of $('units').querySelectorAll('a')){if(a.hash==='#unit-'+unit.chapter)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');}
    $('unitNumber').textContent='期末单元测 · 复习范围第 '+unit.chapter+' 章';
    $('paperTitle').textContent=unit.title;
    $('topics').textContent=unit.topics;
    $('classMatch').textContent=matchNotes[unit.chapter]||'本卷按复习范围中的知识点编排。';
    document.title=unit.title+'单元测 · 模电手记';
    draw();window.scrollTo(0,0);
  }
  $('units').innerHTML=units.map(u=>'<a href="#unit-'+u.chapter+'"><span class="num">'+String(u.chapter).padStart(2,'0')+'</span><span>'+esc(u.title)+'</span></a>').join('');
  $('unitSelect').innerHTML=units.map(u=>'<option value="'+u.chapter+'">第 '+u.chapter+' 章　'+esc(u.title)+'</option>').join('');
  $('unitSelect').addEventListener('change',e=>location.hash='unit-'+e.target.value);
  window.addEventListener('hashchange',openUnit);
  $('paperForm').addEventListener('input',e=>{
    const field=e.target;
    if(attempt.submitted)return;
    if(field.hasAttribute('data-answer'))attempt.answers[field.dataset.answer]=field.type==='radio'?Number(field.value):field.value;
    else if(field.hasAttribute('data-paper'))attempt.paper[field.dataset.paper]=field.checked;
    else return;
    save();
  });
  $('paperForm').addEventListener('change',e=>{
    const field=e.target;
    if(!attempt.submitted||!field.hasAttribute('data-mark'))return;
    if(field.value==='')delete attempt.marks[field.dataset.mark];else attempt.marks[field.dataset.mark]=Number(field.value);
    save();drawSummary();
  });
  $('paperForm').addEventListener('submit',e=>{
    e.preventDefault();if(attempt.submitted)return;
    const missing=unit.questions.filter((q,i)=>!answered(q,i)).length;
    if(missing&&!confirm('还有 '+missing+' 题未作答。按空题 0 分交卷吗？'))return;
    attempt.submitted=true;save();draw();$('summary').scrollIntoView({block:'center'});
  });
  $('paperActions').addEventListener('click',e=>{
    if(e.target.id!=='retake'||!confirm('清除本卷本次作答和成绩，重新开始吗？'))return;
    attempt=fresh();save();draw();window.scrollTo(0,0);
  });
  $('backTop').addEventListener('click',e=>{e.preventDefault();window.scrollTo(0,0);});
  window.addEventListener('beforeprint',()=>{blankPrint=true;draw();});
  window.addEventListener('afterprint',()=>{blankPrint=false;draw();});
  $('printPaper').addEventListener('click',()=>window.print());
  openUnit();
  if(location.protocol!=='file:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
})();
</script>
</body>
</html>
